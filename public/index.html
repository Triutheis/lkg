<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locket Gold Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .console { background: #000; border: 1px solid #334155; height: 200px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 13px; }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #eab308; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-6 bg-slate-800 rounded-xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-extrabold text-center text-yellow-500 mb-2">LOCKET GOLD</h1>
        <p class="text-center text-slate-400 text-sm mb-6">Nhập username để kích hoạt gói Gold</p>
        
        <div class="space-y-4">
            <input type="text" id="username" placeholder="Ví dụ: locket.user" 
                   class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none transition-all text-white">
            
            <button onclick="run()" id="btn" class="w-full py-3 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded-lg shadow-lg active:scale-95 transition-all">
                KÍCH HOẠT NGAY
            </button>
        </div>

        <div id="logs" class="console mt-6 rounded-lg">
            <div class="text-slate-500"> Hệ thống sẵn sàng...</div>
        </div>
    </div>

    <script>
        function log(msg, color = 'text-slate-300') {
            const div = document.createElement('div');
            div.className = color;
            div.innerHTML = `> ${msg}`;
            const logs = document.getElementById('logs');
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }

        async function run() {
            const user = document.getElementById('username').value;
            const btn = document.getElementById('btn');
            if(!user) return alert("Vui lòng nhập Username");

            btn.disabled = true;
            btn.innerHTML = "ĐANG XỬ LÝ...";
            
            log(`Bắt đầu xử lý cho: ${user}...`);
            log(`<span class="loader"></span> Đang truy vấn UID từ locket.cam...`);

            try {
                const response = await fetch(`/api/inject?username=${encodeURIComponent(user)}`);
                const data = await response.json();

                if(data.success) {
                    log(data.message, 'text-green-400 font-bold');
                    log("Vui lòng kiểm tra ứng dụng Locket của bạn.", 'text-yellow-400');
                } else {
                    log(`Lỗi: ${data.message}`, 'text-red-400');
                }
            } catch (e) {
                log("Lỗi kết nối Server Vercel.", 'text-red-500');
            }

            btn.disabled = false;
            btn.innerHTML = "KÍCH HOẠT NGAY";
        }
    </script>
</body>
</html>
